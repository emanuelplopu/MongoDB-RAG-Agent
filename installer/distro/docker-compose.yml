# =============================================================================
# RecallHub Hardened Docker Compose Configuration
# =============================================================================
# This file defines the production container orchestration for the hardened
# Windows installer. All services are isolated on internal networks with
# minimal external exposure.
# =============================================================================

version: '3.8'

services:
  # ===========================================================================
  # MongoDB - Internal Only
  # ===========================================================================
  mongodb:
    image: mongodb/mongodb-atlas-local:latest
    container_name: recallhub-mongodb
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    networks:
      - internal-only
    restart: unless-stopped
    # NO PORT MAPPINGS - internal network only
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ===========================================================================
  # Ollama - Local LLM Service (Internal Only)
  # ===========================================================================
  ollama:
    image: ollama/ollama:latest
    container_name: recallhub-ollama
    volumes:
      - ollama_models:/root/.ollama
    networks:
      - internal-only
    restart: unless-stopped
    # NO PORT MAPPINGS - internal network only
    environment:
      - OLLAMA_HOST=0.0.0.0
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ===========================================================================
  # Backend API - Internal Only
  # ===========================================================================
  backend:
    image: recallhub-hardened-backend:${VERSION:-latest}
    container_name: recallhub-backend
    env_file:
      - ./.env
    volumes:
      - documents_data:/app/documents:ro
      - projects_data:/app/projects:ro
      - config_data:/app/config
      - logs_data:/app/logs
    networks:
      - internal-only
    depends_on:
      mongodb:
        condition: service_healthy
      ollama:
        condition: service_healthy
    restart: unless-stopped
    # NO PORT MAPPINGS - internal network only
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11000/api/v1/status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ===========================================================================
  # Frontend - Localhost Only Exposure
  # ===========================================================================
  frontend:
    image: recallhub-hardened-frontend:${VERSION:-latest}
    container_name: recallhub-frontend
    networks:
      - internal-only
      - frontend-net
    ports:
      # ONLY exposed port - bound to localhost only
      - "127.0.0.1:11080:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

# =============================================================================
# Networks
# =============================================================================
networks:
  internal-only:
    driver: bridge
    internal: true  # No external access - containers only
    ipam:
      config:
        - subnet: 172.28.0.0/16
  
  frontend-net:
    driver: bridge
    # Frontend network allows localhost binding only

# =============================================================================
# Volumes
# =============================================================================
volumes:
  mongodb_data:
    driver: local
  mongodb_config:
    driver: local
  ollama_models:
    driver: local
  documents_data:
    driver: local
  projects_data:
    driver: local
  config_data:
    driver: local
  logs_data:
    driver: local
