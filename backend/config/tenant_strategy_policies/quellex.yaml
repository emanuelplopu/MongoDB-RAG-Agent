# Quellex Tenant Strategy Policy
# Strict legal defaults for law firm deployments
tenant_id: quellex
display_name: Quellex Legal

source_policy:
  allow_cross_profile: false
  allow_cross_matter: false
  allow_web: false
  allow_personal: false
  allow_cloud_private: false
  web_requires_sanitization: true
  require_source_spans: true
  prefer_latest_versions: true
  exclude_boilerplate: true
  primary_sources:
    - documents
    - cases
  secondary_sources: []
  excluded_sources: []

language_policy:
  primary_languages: [de]
  supported_languages: [de, en]
  fallback_language: de
  detect_query_language: true
  enforce_response_language: true
  terminology_preservation:
    de:
      - Sachverständiger
      - Gutachten
      - Beweisbeschluss
      - Ergänzungsfragen
      - Schriftsatz
      - Kläger
      - Beklagter
      - Streitwert
      - Sachverhalt
      - Tatbestand
    en:
      - GDPR
      - API

default_capability: legal_matter_qna
