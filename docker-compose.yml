# RecallHub - Full Stack Docker Compose (Multi-Tenant)
# All services run on ports 11000-11100
# Uses Docker Compose profiles for per-tenant container isolation.
#
# Port Assignments:
#   - MongoDB:            11017  (always)
#   - Backend RecallHub:  11000  (profile: recallhub)
#   - Frontend RecallHub: 11080  (profile: recallhub)
#   - Backend Quellex:    11001  (profile: quellex)
#   - Frontend Quellex:   11081  (profile: quellex)
#   - Airbyte Webapp:     11020  (optional, via docker-compose.airbyte.yml)
#   - Airbyte API:        11021  (optional, via docker-compose.airbyte.yml)
#   - Airbyte Builder:    11022  (optional, via docker-compose.airbyte.yml)
#   - Embedding server:   11090  (optional, profile: embedder [CPU] or embedder-gpu [NVIDIA])
#   - LAN gateway Quellex: 443 / 80   (profile: quellex, TLS edge for https://quellex.local)
#   - LAN gateway RecallHub: 11443 / 11480 (profile: recallhub, https://recallhub.local:11443)
#
# Network exposure:
#   Every port above except the LAN gateways binds to BIND_ADDRESS, default
#   127.0.0.1, so plain-HTTP frontends, the API and the unauthenticated MongoDB
#   are reachable from this machine only. Other computers use the TLS gateway
#   (gateway/README.md). Set BIND_ADDRESS=0.0.0.0 in .env to restore raw-port
#   access (e.g. Tailscale access to a dev box).
#
# Usage:
#   Dev (both tenants):       docker compose --profile recallhub --profile quellex up -d
#   RecallHub only:           docker compose --profile recallhub up -d
#   Quellex only:             docker compose --profile quellex up -d
#   Rebuild specific tenant:  docker compose --profile quellex build frontend-quellex
#   With Airbyte:             docker compose --profile recallhub -f docker-compose.yml -f docker-compose.airbyte.yml up -d
#   Local embeddings (CPU):   docker compose --profile recallhub --profile embedder up -d
#   Local embeddings (GPU):   docker compose --profile recallhub --profile embedder-gpu up -d   (needs NVIDIA Container Toolkit)
#
# The project name is pinned so container, network and image names do not
# depend on the folder this file lives in (C:\RecallHub, C:\Quellex, a git
# checkout, ...). Images carry explicit names for the same reason: the offline
# backup/restore flow exports and loads them by these exact names.
name: recallhub

services:
  # ===========================================
  # MongoDB Atlas Local - Vector Search & Atlas Search
  # ===========================================
  # No profile = always starts
  mongodb:
    image: mongodb/mongodb-atlas-local:8.0
    container_name: rag-mongodb
    hostname: rag-mongodb-host
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:11017:27017"
    volumes:
      - ./data/mongoDB/db:/data/db
      - ./data/mongoDB/configdb:/data/configdb
      # mongot (Atlas Search) keeps its Lucene index data here. Without this
      # mount every container recreation rebuilt all search indexes from
      # scratch, which takes hours for the larger profiles.
      - ./data/mongoDB/mongot:/data/mongot
      - ./scripts:/docker-entrypoint-initdb.d:ro
    environment:
      - DO_NOT_TRACK=1
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - rag-network
    restart: unless-stopped

  # ===========================================
  # Ingestion Worker - Background document processing (shared)
  # ===========================================
  # No profile = always starts. Shared worker serves all tenants.
  # Build: Uses same shared base image as backend
  #   Code changes: docker-compose build ingestion-worker (uses Dockerfile.worker, ~30 sec)
  ingestion-worker:
    build:
      context: .
      dockerfile: backend/Dockerfile.worker
    image: recallhub-ingestion-worker:latest
    container_name: rag-ingestion-worker
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      # MongoDB connection (internal container network)
      - MONGODB_URI=mongodb://mongodb:27017/?directConnection=true
      - MONGODB_DATABASE=${MONGODB_DATABASE:-rag_db}
      
      # Embedding Configuration (needed for document processing)
      - EMBEDDING_PROVIDER=${EMBEDDING_PROVIDER:-openai}
      - EMBEDDING_API_KEY=${EMBEDDING_API_KEY}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-text-embedding-3-small}
      - EMBEDDING_BASE_URL=${EMBEDDING_BASE_URL:-https://api.openai.com/v1}
      - EMBEDDING_DIMENSION=${EMBEDDING_DIMENSION:-1536}
      
      # LLM Configuration (for audio transcription via Whisper)
      - LLM_PROVIDER=${LLM_PROVIDER:-openai}
      - LLM_API_KEY=${LLM_API_KEY}
      - LLM_BASE_URL=${LLM_BASE_URL:-https://api.openai.com/v1}

      # OCR engine for scanned pages (docs/24-OCR_SCAN_QUALITY_CHECK.md)
      - OCR_ENGINE=${OCR_ENGINE:-tesseract}
      - OCR_LANGUAGES=${OCR_LANGUAGES:-deu,eng}
      - OCR_SCAN_DPI=${OCR_SCAN_DPI:-216}
      - OCR_IMAGE_MAX_MPX=${OCR_IMAGE_MAX_MPX:-8}
      - OCR_PSM=${OCR_PSM:-}
      - OCR_TESSDATA_PATH=${OCR_TESSDATA_PATH:-}
      - OCR_OSD_MIN_CONFIDENCE=${OCR_OSD_MIN_CONFIDENCE:-10}
      - INGEST_PAGE_FURNITURE=${INGEST_PAGE_FURNITURE:-false}
      - INGEST_TABLE_STRUCTURE=${INGEST_TABLE_STRUCTURE:-true}
      - OCR_RECT_DILATION=${OCR_RECT_DILATION:-20}
      - OCR_IMAGE_NOISE_GATE=${OCR_IMAGE_NOISE_GATE:-false}
      - INGEST_SKIP_IMAGE_ONLY_PDF=${INGEST_SKIP_IMAGE_ONLY_PDF:-false}

      # Profile configuration
      - PROFILES_PATH=/app/profiles.yaml
    volumes:
      - ./documents:/app/documents:ro
      - ./projects:/app/projects:ro
      - ./profiles.yaml:/app/profiles.yaml:ro
      # Profile document folders, same paths as the backends (see there)
      - ./mounts:/app/mounts:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import sys; sys.exit(0)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - rag-network
    restart: unless-stopped

  # ===========================================
  # Local embedding server - llama.cpp (optional, shared by all tenants)
  # ===========================================
  # Serves EmbeddingGemma 2 (or any GGUF embedding model) through an
  # OpenAI-compatible /v1/embeddings API plus llama.cpp's native endpoints
  # (/props, multimodal /embeddings). Exactly one of the two variants runs;
  # both answer on the network alias `embedder` so app config never changes:
  #   EMBEDDING_PROVIDER=openai  EMBEDDING_BASE_URL=http://embedder:8080/v1
  # The GGUF is downloaded from Hugging Face on first start and cached in the
  # `embedder_models` volume (offline installs can pre-populate it).
  embedder:
    profiles: [embedder]
    image: ghcr.io/ggml-org/llama.cpp:server
    container_name: rag-embedder
    command:
      - "-hf"
      - "${EMBEDDER_HF_MODEL:-ggml-org/embeddinggemma-2-GGUF:Q8_0}"
      - "--embeddings"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8080"
      - "-c"
      - "${EMBEDDER_CTX:-32768}"
      - "-np"
      - "${EMBEDDER_SLOTS:-4}"
      - "-b"
      - "8192"
      - "-ub"
      - "8192"
      - "-t"
      - "${EMBEDDER_THREADS:-8}"
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:11090:8080"
    volumes:
      - embedder_models:/root/.cache
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 120s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      rag-network:
        aliases:
          - embedder
    restart: unless-stopped

  # NVIDIA variant: same server built with CUDA, all layers offloaded to the GPU.
  # Requires the NVIDIA Container Toolkit on the host (`nvidia-smi` must work in
  # `docker run --gpus all nvidia/cuda:12.4.0-base-ubuntu22.04 nvidia-smi`).
  embedder-gpu:
    profiles: [embedder-gpu]
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    container_name: rag-embedder-gpu
    command:
      - "-hf"
      - "${EMBEDDER_HF_MODEL:-ggml-org/embeddinggemma-2-GGUF:Q8_0}"
      - "--embeddings"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8080"
      - "-c"
      - "${EMBEDDER_CTX:-32768}"
      - "-np"
      - "${EMBEDDER_SLOTS:-4}"
      - "-b"
      - "8192"
      - "-ub"
      - "8192"
      - "-ngl"
      - "${EMBEDDER_GPU_LAYERS:-999}"
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:11090:8080"
    volumes:
      - embedder_models:/root/.cache
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 120s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      rag-network:
        aliases:
          - embedder
    restart: unless-stopped

  # ===========================================================================
  #  RECALLHUB TENANT  (profile: recallhub)
  # ===========================================================================

  # -------------------------------------------
  # RecallHub Backend - FastAPI REST API
  # -------------------------------------------
  # Build: Uses shared base image for fast rebuilds
  #   1. First time: docker build -f backend/Dockerfile.base -t recallhub-backend-base:latest .
  #   2. Code changes: docker compose --profile recallhub build backend (~30 sec)
  backend:
    profiles: [recallhub]
    build:
      context: .
      dockerfile: backend/Dockerfile.fast
    image: recallhub-backend:latest
    container_name: rag-backend
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:11000:8000"
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      # MongoDB connection (internal container network)
      - MONGODB_URI=mongodb://mongodb:27017/?directConnection=true
      - MONGODB_DATABASE=${MONGODB_DATABASE:-rag_db}

      # Tenant
      - TENANT_ID=recallhub
      # Guest access stays allowed for RecallHub unless overridden in .env
      - REQUIRE_AUTH=${RECALLHUB_REQUIRE_AUTH:-false}
      - REGISTRATION_MODE=${REGISTRATION_MODE:-open}
      - INVITE_CODES=${INVITE_CODES:-}
      
      # Profile (overrides profiles.yaml active_profile). Override per machine in .env
      # with RECALLHUB_ACTIVE_PROFILE / RECALLHUB_MONGODB_DATABASE instead of editing this file.
      - ACTIVE_PROFILE=${RECALLHUB_ACTIVE_PROFILE:-parhelion}

      # LLM Configuration
      - LLM_PROVIDER=${LLM_PROVIDER:-openai}
      - LLM_API_KEY=${LLM_API_KEY}
      - LLM_MODEL=${LLM_MODEL:-gpt-5.2}
      - LLM_BASE_URL=${LLM_BASE_URL:-https://api.openai.com/v1}

      # Embedding Configuration
      - EMBEDDING_PROVIDER=${EMBEDDING_PROVIDER:-openai}
      - EMBEDDING_API_KEY=${EMBEDDING_API_KEY}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-text-embedding-3-small}
      - EMBEDDING_BASE_URL=${EMBEDDING_BASE_URL:-https://api.openai.com/v1}
      - EMBEDDING_DIMENSION=${EMBEDDING_DIMENSION:-1536}

      # OCR engine for scanned pages (docs/24-OCR_SCAN_QUALITY_CHECK.md)
      - OCR_ENGINE=${OCR_ENGINE:-tesseract}
      - OCR_LANGUAGES=${OCR_LANGUAGES:-deu,eng}
      - OCR_SCAN_DPI=${OCR_SCAN_DPI:-216}
      - OCR_IMAGE_MAX_MPX=${OCR_IMAGE_MAX_MPX:-8}
      - OCR_PSM=${OCR_PSM:-}
      - OCR_TESSDATA_PATH=${OCR_TESSDATA_PATH:-}
      - OCR_OSD_MIN_CONFIDENCE=${OCR_OSD_MIN_CONFIDENCE:-10}
      - INGEST_PAGE_FURNITURE=${INGEST_PAGE_FURNITURE:-false}
      - INGEST_TABLE_STRUCTURE=${INGEST_TABLE_STRUCTURE:-true}
      - OCR_RECT_DILATION=${OCR_RECT_DILATION:-20}
      - OCR_IMAGE_NOISE_GATE=${OCR_IMAGE_NOISE_GATE:-false}
      - INGEST_SKIP_IMAGE_ONLY_PDF=${INGEST_SKIP_IMAGE_ONLY_PDF:-false}

      # Profile configuration
      - PROFILES_PATH=/app/profiles.yaml
      # Folders organisation admins may pick for a profile (docs/22). Local
      # folders live in ./mounts, network shares are attached below /app/mounts
      # by docker-compose.shares.yml (installer/scripts/Add-NetworkShare.ps1).
      - DOCUMENT_ROOTS=${DOCUMENT_ROOTS:-/app/mounts,/app/documents}
      # container_path=host_path|... so "Open in Explorer" can show the Windows/UNC path
      - MOUNT_MAPPINGS=${MOUNT_MAPPINGS:-}

      # Airbyte Integration (optional - for Confluence/Jira)
      - AIRBYTE_ENABLED=${AIRBYTE_ENABLED:-false}
      - AIRBYTE_API_URL=${AIRBYTE_API_URL:-http://airbyte-server:8001}
      - AIRBYTE_WEBAPP_URL=${AIRBYTE_WEBAPP_URL:-http://localhost:11020}
    volumes:
      - ./documents:/app/documents
      - ./projects:/app/projects
      - ./profiles.yaml:/app/profiles.yaml
      - ./data/backups:/app/data/backups
      - ./data/telemetry:/app/data/telemetry
      # Profile document folders: every sub-folder of ./mounts is visible as
      # /app/mounts/<name> here and in the ingestion worker (same path, so the
      # document viewer finds what the worker indexed). Network shares are
      # attached below /app/mounts by docker-compose.shares.yml (docs/22).
      - ./mounts:/app/mounts:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - rag-network
    restart: unless-stopped

  # -------------------------------------------
  # RecallHub Frontend - React + Vite (served by nginx)
  # -------------------------------------------
  frontend:
    profiles: [recallhub]
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        TENANT: recallhub
    image: recallhub-frontend:latest
    container_name: rag-frontend
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:11080:80"
    environment:
      - BACKEND_HOST=backend
      - SERVER_DOMAINS=recallhub.app www.recallhub.app
      - API_DOMAIN=api.recallhub.app
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - rag-network
    restart: unless-stopped

  # -------------------------------------------
  # RecallHub LAN gateway - Caddy TLS edge (https://recallhub.local:11443)
  # -------------------------------------------
  # The only RecallHub port other computers are meant to reach. Caddy issues a
  # certificate from its own local CA (export it with
  # installer\scripts\Export-LanCertificate.ps1), redirects HTTP to HTTPS and
  # forwards to the frontend nginx, which proxies /api to the backend.
  # Name resolution (recallhub.local) is announced by the tray app; see
  # gateway/README.md and docs/21-LAN_ACCESS.md.
  gateway:
    profiles: [recallhub]
    image: caddy:2.10-alpine
    container_name: rag-gateway
    ports:
      - "${RECALLHUB_GATEWAY_HTTPS_PORT:-11443}:443"
      - "${RECALLHUB_GATEWAY_HTTP_PORT:-11480}:80"
    environment:
      - GATEWAY_HOSTS=${RECALLHUB_GATEWAY_HOSTS:-https://recallhub.local, https://recallhub}
      - GATEWAY_UPSTREAM=frontend:80
    command:
      - sh
      - -c
      - 'tr -d "\015" < /etc/caddy/Caddyfile.template | sed -e "s|__HOSTS__|$$GATEWAY_HOSTS|g" -e "s|__UPSTREAM__|$$GATEWAY_UPSTREAM|g" > /etc/caddy/Caddyfile && exec caddy run --config /etc/caddy/Caddyfile --adapter caddyfile'
    volumes:
      - ./gateway/Caddyfile.template:/etc/caddy/Caddyfile.template:ro
      - gateway_data:/data
      - gateway_config:/config
    depends_on:
      - frontend
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - rag-network
    restart: unless-stopped

  # ===========================================================================
  #  QUELLEX TENANT  (profile: quellex)
  # ===========================================================================

  # -------------------------------------------
  # Quellex Backend - FastAPI REST API
  # -------------------------------------------
  backend-quellex:
    profiles: [quellex]
    build:
      context: .
      dockerfile: backend/Dockerfile.fast
    image: recallhub-backend:latest
    container_name: rag-backend-quellex
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:11001:8000"
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      # MongoDB connection (internal container network)
      - MONGODB_URI=mongodb://mongodb:27017/?directConnection=true
      - MONGODB_DATABASE=${QUELLEX_MONGODB_DATABASE:-rag_diejuristin}

      # Tenant
      - TENANT_ID=quellex
      - REGISTRATION_MODE=${REGISTRATION_MODE:-open}
      - INVITE_CODES=${INVITE_CODES:-}
      # Every API call needs a signed-in user (backend/core/auth_middleware.py);
      # the frontend mirrors this via /api/v1/tenant/config.
      - REQUIRE_AUTH=${QUELLEX_REQUIRE_AUTH:-true}
      
      # Tool Gating - Quellex is fully offline, no web tools
      - TENANT_DISABLED_TOOLS=web_search,browse_web
      
      # Profile (overrides profiles.yaml active_profile). Override per machine in .env
      # with QUELLEX_ACTIVE_PROFILE / QUELLEX_MONGODB_DATABASE instead of editing this file.
      - ACTIVE_PROFILE=${QUELLEX_ACTIVE_PROFILE:-diejuristin}

      # LLM Configuration
      - LLM_PROVIDER=${LLM_PROVIDER:-openai}
      - LLM_API_KEY=${LLM_API_KEY}
      - LLM_MODEL=${LLM_MODEL:-gpt-5.2}
      - LLM_BASE_URL=${LLM_BASE_URL:-https://api.openai.com/v1}

      # Embedding Configuration
      - EMBEDDING_PROVIDER=${EMBEDDING_PROVIDER:-openai}
      - EMBEDDING_API_KEY=${EMBEDDING_API_KEY}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-text-embedding-3-small}
      - EMBEDDING_BASE_URL=${EMBEDDING_BASE_URL:-https://api.openai.com/v1}
      - EMBEDDING_DIMENSION=${EMBEDDING_DIMENSION:-1536}

      # OCR engine for scanned pages (docs/24-OCR_SCAN_QUALITY_CHECK.md)
      - OCR_ENGINE=${OCR_ENGINE:-tesseract}
      - OCR_LANGUAGES=${OCR_LANGUAGES:-deu,eng}
      - OCR_SCAN_DPI=${OCR_SCAN_DPI:-216}
      - OCR_IMAGE_MAX_MPX=${OCR_IMAGE_MAX_MPX:-8}
      - OCR_PSM=${OCR_PSM:-}
      - OCR_TESSDATA_PATH=${OCR_TESSDATA_PATH:-}
      - OCR_OSD_MIN_CONFIDENCE=${OCR_OSD_MIN_CONFIDENCE:-10}
      - INGEST_PAGE_FURNITURE=${INGEST_PAGE_FURNITURE:-false}
      - INGEST_TABLE_STRUCTURE=${INGEST_TABLE_STRUCTURE:-true}
      - OCR_RECT_DILATION=${OCR_RECT_DILATION:-20}
      - OCR_IMAGE_NOISE_GATE=${OCR_IMAGE_NOISE_GATE:-false}
      - INGEST_SKIP_IMAGE_ONLY_PDF=${INGEST_SKIP_IMAGE_ONLY_PDF:-false}

      # Profile configuration
      - PROFILES_PATH=/app/profiles.yaml
      # Folders organisation admins may pick for a profile (docs/22). Local
      # folders live in ./mounts, network shares are attached below /app/mounts
      # by docker-compose.shares.yml (installer/scripts/Add-NetworkShare.ps1).
      - DOCUMENT_ROOTS=${DOCUMENT_ROOTS:-/app/mounts,/app/documents}
      # container_path=host_path|... so "Open in Explorer" can show the Windows/UNC path
      - MOUNT_MAPPINGS=${MOUNT_MAPPINGS:-}

      # Airbyte Integration (optional - for Confluence/Jira)
      - AIRBYTE_ENABLED=${AIRBYTE_ENABLED:-false}
      - AIRBYTE_API_URL=${AIRBYTE_API_URL:-http://airbyte-server:8001}
      - AIRBYTE_WEBAPP_URL=${AIRBYTE_WEBAPP_URL:-http://localhost:11020}
    volumes:
      - ./documents:/app/documents
      - ./projects:/app/projects
      - ./profiles.yaml:/app/profiles.yaml
      - ./data/backups:/app/data/backups
      - ./data/telemetry:/app/data/telemetry
      # Profile document folders: every sub-folder of ./mounts is visible as
      # /app/mounts/<name> here and in the ingestion worker (same path, so the
      # document viewer finds what the worker indexed). Network shares are
      # attached below /app/mounts by docker-compose.shares.yml (docs/22).
      - ./mounts:/app/mounts:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - rag-network
    restart: unless-stopped

  # -------------------------------------------
  # Quellex Frontend - React + Vite (served by nginx)
  # -------------------------------------------
  frontend-quellex:
    profiles: [quellex]
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        TENANT: quellex
    image: recallhub-frontend-quellex:latest
    container_name: rag-frontend-quellex
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:11081:80"
    environment:
      - BACKEND_HOST=backend-quellex
      - SERVER_DOMAINS=test-0-8-7.quellex.at
      - API_DOMAIN=test-0-8-7.quellex.at
    depends_on:
      - backend-quellex
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - rag-network
    restart: unless-stopped

  # -------------------------------------------
  # Quellex LAN gateway - Caddy TLS edge (https://quellex.local)
  # -------------------------------------------
  # Default ports 443/80 so colleagues simply open https://quellex.local (or
  # https://quellex on Windows). The backend runs with REQUIRE_AUTH, so every
  # request through here needs a login and a valid session.
  gateway-quellex:
    profiles: [quellex]
    image: caddy:2.10-alpine
    container_name: rag-gateway-quellex
    ports:
      - "${QUELLEX_GATEWAY_HTTPS_PORT:-443}:443"
      - "${QUELLEX_GATEWAY_HTTP_PORT:-80}:80"
    environment:
      - GATEWAY_HOSTS=${QUELLEX_GATEWAY_HOSTS:-https://quellex.local, https://quellex}
      - GATEWAY_UPSTREAM=frontend-quellex:80
    command:
      - sh
      - -c
      - 'tr -d "\015" < /etc/caddy/Caddyfile.template | sed -e "s|__HOSTS__|$$GATEWAY_HOSTS|g" -e "s|__UPSTREAM__|$$GATEWAY_UPSTREAM|g" > /etc/caddy/Caddyfile && exec caddy run --config /etc/caddy/Caddyfile --adapter caddyfile'
    volumes:
      - ./gateway/Caddyfile.template:/etc/caddy/Caddyfile.template:ro
      - gateway_quellex_data:/data
      - gateway_quellex_config:/config
    depends_on:
      - frontend-quellex
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - rag-network
    restart: unless-stopped

  # ===========================================
  # CLI Agent (optional - for terminal access)
  # ===========================================
  cli:
    build:
      context: .
      dockerfile: Dockerfile
    image: recallhub-cli:latest
    container_name: rag-cli
    profiles:
      - cli
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      - MONGODB_URI=mongodb://mongodb:27017/?directConnection=true
      - MONGODB_DATABASE=${MONGODB_DATABASE:-rag_db}
      - LLM_PROVIDER=${LLM_PROVIDER:-openai}
      - LLM_API_KEY=${LLM_API_KEY}
      - LLM_MODEL=${LLM_MODEL:-gpt-5.2}
      - LLM_BASE_URL=${LLM_BASE_URL:-https://api.openai.com/v1}
      - EMBEDDING_PROVIDER=${EMBEDDING_PROVIDER:-openai}
      - EMBEDDING_API_KEY=${EMBEDDING_API_KEY}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-text-embedding-3-small}
      - EMBEDDING_BASE_URL=${EMBEDDING_BASE_URL:-https://api.openai.com/v1}
      - EMBEDDING_DIMENSION=${EMBEDDING_DIMENSION:-1536}
      - OCR_ENGINE=${OCR_ENGINE:-tesseract}
      - OCR_LANGUAGES=${OCR_LANGUAGES:-deu,eng}
      - OCR_SCAN_DPI=${OCR_SCAN_DPI:-216}
      - OCR_IMAGE_MAX_MPX=${OCR_IMAGE_MAX_MPX:-8}
      - OCR_PSM=${OCR_PSM:-}
      - OCR_TESSDATA_PATH=${OCR_TESSDATA_PATH:-}
      - OCR_OSD_MIN_CONFIDENCE=${OCR_OSD_MIN_CONFIDENCE:-10}
      - INGEST_PAGE_FURNITURE=${INGEST_PAGE_FURNITURE:-false}
      - INGEST_TABLE_STRUCTURE=${INGEST_TABLE_STRUCTURE:-true}
      - OCR_RECT_DILATION=${OCR_RECT_DILATION:-20}
      - OCR_IMAGE_NOISE_GATE=${OCR_IMAGE_NOISE_GATE:-false}
      - INGEST_SKIP_IMAGE_ONLY_PDF=${INGEST_SKIP_IMAGE_ONLY_PDF:-false}
      - PROFILES_PATH=/app/profiles.yaml
      # ACTIVE_PROFILE can be set to override profiles.yaml
    volumes:
      - ./documents:/app/documents
      - ./projects:/app/projects
      - ./profiles.yaml:/app/profiles.yaml
      - ./mounts:/app/mounts:ro
    stdin_open: true
    tty: true
    networks:
      - rag-network

networks:
  rag-network:
    driver: bridge

volumes:
  # GGUF cache for the llama.cpp embedding server (~310 MB for EmbeddingGemma 2 Q8_0)
  embedder_models:
    driver: local
  # Caddy state for the LAN gateways: the local CA and the issued certificates
  # live in *_data. Deleting the volume creates a new CA, and every client
  # that trusted the old root certificate has to import the new one.
  gateway_data:
    driver: local
  gateway_config:
    driver: local
  gateway_quellex_data:
    driver: local
  gateway_quellex_config:
    driver: local
